name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format check (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPDF_RIPPER_CORE_ENABLE_TESTS=OFF

      - name: Check formatting
        run: cmake --build build --target pdf_ripper_core_format_check

  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug -j

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure

  clang-tidy:
    name: clang-tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Add LLVM to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # shellcheck disable=SC2028,SC2086
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Append

      # Tests are excluded from static analysis by default
      # (PDF_RIPPER_CORE_TIDY_INCLUDE_TESTS defaults to OFF); disabling the
      # test build here also skips the Catch2 dependency fetch.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPDF_RIPPER_CORE_ENABLE_TESTS=OFF

      # Ninja is required on Windows to emit compile_commands.json, which the
      # clang-tidy target resolves via `-p <build dir>`.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPDF_RIPPER_CORE_ENABLE_TESTS=OFF

      - name: Run clang-tidy
        run: cmake --build build --config Debug --target pdf_ripper_core_tidy