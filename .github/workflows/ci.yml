name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format check (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Version-pinned to match the LLVM 22.1.0 toolchain the project is
      # formatted against; apt's clang-format (v18 on Ubuntu 24.04) disagrees.
      - name: Install clang-format 22.1.0
        run: pip install clang-format==22.1.0

      - name: Verify clang-format version
        run: clang-format --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPDF_RIPPER_CORE_ENABLE_TESTS=OFF

      - name: Check formatting
        run: cmake --build build --target pdf_ripper_core_format_check

  build-and-test:
    name: Build & test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned so the runner image does not drift between runs;
        # the C++23 baseline compiler (GCC 15) is installed explicitly by the
        # install-gcc-15 action below.
        os: [ubuntu-24.04, windows-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 15
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-gcc-15

      # BUILD_SHARED_LIBS=OFF on Windows forces zlib-ng to build static; its
      # default shared build would otherwise require its DLL at test runtime
      # (Catch2 test discovery exits with 0xc0000135).
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  install-consumer:
    name: Installed-package consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 15
        uses: ./.github/actions/install-gcc-15

      - name: Verify install and external consumer
        run: ./scripts/verify_install.sh

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 15
        uses: ./.github/actions/install-gcc-15

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 15
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-gcc-15

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # clang-tidy is pinned to LLVM 22.1.0 to match the formatting toolchain
      # (see the format-check job). apt's clang-tidy (v18 on Ubuntu 24.04)
      # hangs on template-heavy translation units under clang-analyzer checks,
      # which can stall the static-analysis job for hours.
      - name: Install clang-tidy 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -LsS https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo ln -sf /usr/lib/llvm-22/bin/clang-tidy /usr/local/bin/clang-tidy
          clang-tidy --version

      - name: Add LLVM to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # shellcheck disable=SC2028,SC2086
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Append

      # Tests are excluded from static analysis by default
      # (PDF_RIPPER_CORE_TIDY_INCLUDE_TESTS defaults to OFF); disabling the
      # test build here also skips the Catch2 dependency fetch.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPDF_RIPPER_CORE_ENABLE_TESTS=OFF

      # Ninja is required on Windows to emit compile_commands.json, which the
      # clang-tidy target resolves via `-p <build dir>`.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPDF_RIPPER_CORE_ENABLE_TESTS=OFF

      - name: Run clang-tidy
        run: cmake --build build --config Debug --target pdf_ripper_core_tidy